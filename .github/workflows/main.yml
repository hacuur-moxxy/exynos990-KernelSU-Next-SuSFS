name: Build Exynos 990 Kernel with Latest KSU Next

on:
  workflow_dispatch: 

jobs:
  build:
    runs-on: ubuntu-20.04 

    steps:
    - name: Checkout Kernel Source
      uses: actions/checkout@v4

    - name: Install Build Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential bc bison flex libssl-dev make libc6-dev libncurses5-dev crossbuild-essential-arm64 git zip curl patch

    - name: Update KernelSU Next & Apply SuSFS Patch
      run: |
        # 1. Delete the old version bundled in the repo
        rm -rf KernelSU-Next
        
        # 2. Clone the absolute latest 'next' branch
        git clone https://github.com/KernelSU-Next/KernelSU-Next.git -b next KernelSU-Next
        
        # 3. Download the SuSFS patch for KSU
        curl -LSs "https://gitlab.com/simonpunk/susfs4ksu/-/raw/susfs-v1.5.2/kernel_patches/KernelSU/10_enable_susfs_for_ksu.patch" -o ksu_susfs.patch
        
        # 4. Apply the patch to the new KSU folder
        cd KernelSU-Next
        patch -p1 < ../ksu_susfs.patch
        cd ..

    - name: Download Toolchains
      run: |
        mkdir -p ../tc
        cd ../tc
        
        git clone --depth=1 https://android.googlesource.com/platform/prebuilts/gcc/linux-x86/aarch64/aarch64-linux-android-4.9 gcc49
        
        git clone --depth=1 https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86 clang-repo
        mv clang-repo/clang-r370808 clang10
        rm -rf clang-repo

    - name: Build the Kernel
      run: |
        export CLANG_DIR=$(pwd)/../tc/clang10
        export GCC_DIR=$(pwd)/../tc/gcc49
        
        chmod +x build.sh
        
        # NOTE: Change y2s to x1s here if you have the base Galaxy S20
        ./build.sh -m y2s

    - name: Upload Kernel Image
      uses: actions/upload-artifact@v4
      with:
        name: kernel-image
        path: out_y2s/arch/arm64/boot/Image

