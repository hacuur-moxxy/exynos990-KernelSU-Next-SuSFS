name: Build Exynos 990 Kernel with Latest KSU Next

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout Kernel Source
      uses: actions/checkout@v4
      
    - name: Install Build Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential bc bison flex libssl-dev make libc6-dev libncurses5-dev crossbuild-essential-arm64 git zip curl patch
        
    - name: Update KernelSU Next
      run: |
        # 1. Delete the old version bundled in the repo
        rm -rf KernelSU-Next
        
        # 2. Clone the latest KernelSU-Next repository using the default active branch
        git clone https://github.com/KernelSU-Next/KernelSU-Next.git KernelSU-Next
        
    - name: Download Toolchains
      run: |
        mkdir -p ../tc
        cd ../tc
        
        # Download GCC 4.9
        git clone --depth=1 https://android.googlesource.com/platform/prebuilts/gcc/linux-x86/aarch64/aarch64-linux-android-4.9 gcc49
        
        # Download Proton Clang (Replaces the broken AOSP Clang 10)
        git clone --depth=1 https://github.com/kdrag0n/proton-clang.git clang10
        
    - name: Build the Kernel
      run: |
        export CLANG_DIR=$(pwd)/../tc/clang10
        export GCC_DIR=$(pwd)/../tc/gcc49
        
        chmod +x build.sh
        
        ./build.sh -m g985f
        
    - name: Upload Kernel Image
      uses: actions/upload-artifact@v4
      with:
        name: kernel-image
        path: out_g985f/arch/arm64/boot/Image
