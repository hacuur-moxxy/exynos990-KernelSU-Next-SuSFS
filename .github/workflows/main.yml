name: Build Exynos 990 Kernel with Latest KSU Next

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    
    steps:
    - name: Checkout Kernel Source
      uses: actions/checkout@v4
      
    - name: Install Build Dependencies
      run: |
        sudo dpkg --add-architecture i386
        sudo apt-get update
        sudo apt-get install -y build-essential bc bison flex libssl-dev make libc6-dev libncurses5-dev libncurses-dev crossbuild-essential-arm64 git zip curl patch libc6:i386 lib32z1 libstdc++6:i386
        
    - name: Update KernelSU Next
      run: |
        rm -rf KernelSU-Next
        git clone https://github.com/KernelSU-Next/KernelSU-Next.git KernelSU-Next
        
    - name: Download Official Toolchains (AOSP Clang r370808 & GCC 4.9)
      run: |
        mkdir -p ../tc
        cd ../tc
        
        # Clone GCC 4.9 into the exact folder build.sh expects
        git clone --depth=1 https://android.googlesource.com/platform/prebuilts/gcc/linux-x86/aarch64/aarch64-linux-android-4.9 gcc49
        
        # Clone AOSP Clang r370808 (Clang 10.0.1) into clang10 as required by the Exynos 990 guide
        git clone --depth=1 -b r370808 https://github.com/Nicklas373/aosp-clang.git clang10
        
    - name: Build the Kernel
      run: |
        export CLANG_DIR=$(pwd)/../tc/clang10
        export GCC_DIR=$(pwd)/../tc/gcc49
        
        chmod +x build.sh
        ./build.sh -m g985f
        
    - name: Upload Kernel Image
      uses: actions/upload-artifact@v4
      with:
        name: kernel-image
        path: out_g985f/arch/arm64/boot/Image
