name: Build Exynos 990 Kernel with Latest KSU Next

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout Kernel Source
      uses: actions/checkout@v4
      
    - name: Install Build Dependencies
      run: |
        sudo dpkg --add-architecture i386
        sudo apt-get update
        sudo apt-get install -y build-essential bc bison flex libssl-dev make libc6-dev libncurses5-dev libncurses-dev crossbuild-essential-arm64 git zip curl patch libc6:i386 lib32z1 libstdc++6:i386
        
    - name: Update KernelSU Next
      run: |
        rm -rf KernelSU-Next
        git clone https://github.com/KernelSU-Next/KernelSU-Next.git KernelSU-Next
        
    - name: Download Toolchains
      run: |
        mkdir -p ../tc
        cd ../tc
        
        git clone --depth=1 https://android.googlesource.com/platform/prebuilts/gcc/linux-x86/aarch64/aarch64-linux-android-4.9 gcc49
        git clone --depth=1 https://github.com/kdrag0n/proton-clang.git clang10
        
    - name: Build the Kernel
      run: |
        # Define toolchain paths
        export CLANG_DIR=$(pwd)/../tc/clang10
        export GCC_DIR=$(pwd)/../tc/gcc49
        export PATH="${CLANG_DIR}/bin:${GCC_DIR}/bin:${PATH}"
        
        # Force the modern Ubuntu host compiler to disable .relr.dyn compression
        export KBUILD_HOSTLDFLAGS="-Wl,-z,nopack-relative-relocs"
        export HOSTLDFLAGS="-Wl,-z,nopack-relative-relocs"
        export PROTOC_EXTRA_LDFLAGS="-Wl,-z,nopack-relative-relocs"
        
        chmod +x build.sh
        
        ./build.sh -m g985f
        
    - name: Upload Kernel Image
      uses: actions/upload-artifact@v4
      with:
        name: kernel-image
        path: out_g985f/arch/arm64/boot/Image
