name: Build Exynos 990 Kernel with Latest KSU Next

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    
    steps:
    - name: Checkout Kernel Source
      uses: actions/checkout@v4
      
    - name: Install Build Dependencies
      run: |
        sudo dpkg --add-architecture i386
        sudo apt-get update
        sudo apt-get install -y build-essential bc bison flex libssl-dev make libc6-dev libncurses5-dev libncurses-dev crossbuild-essential-arm64 git zip curl patch libc6:i386 lib32z1 libstdc++6:i386
        
    - name: Update KernelSU Next
      run: |
        rm -rf KernelSU-Next
        git clone https://github.com/KernelSU-Next/KernelSU-Next.git KernelSU-Next
        
    - name: Download Toolchains Inside Workspace
      run: |
        mkdir -p toolchain
        cd toolchain
        
        git clone --depth=1 https://android.googlesource.com/platform/prebuilts/gcc/linux-x86/aarch64/aarch64-linux-android-4.9 aarch64-linux-android-4.9
        git clone --depth=1 https://android.googlesource.com/platform/prebuilts/gcc/linux-x86/arm/arm-linux-androideabi-4.9 arm-linux-androideabi-4.9
        git clone --depth=1 https://github.com/kdrag0n/proton-clang.git clang10
        
    - name: Build the Kernel
      run: |
        export CLANG_DIR=$(pwd)/toolchain/clang10
        export GCC_DIR=$(pwd)/toolchain/aarch64-linux-android-4.9
        export GCC_32_DIR=$(pwd)/toolchain/arm-linux-androideabi-4.9
        
        # Override build.sh internal path variables
        sed -i "s|CLANG_PATH=.*|CLANG_PATH=${CLANG_DIR}|g" build.sh || true
        sed -i "s|GCC_PATH=.*|GCC_PATH=${GCC_DIR}|g" build.sh || true
        sed -i "s|GCC_32_PATH=.*|GCC_32_PATH=${GCC_32_DIR}|g" build.sh || true
        
        export ARCH=arm64
        export SUBARCH=arm64
        export CROSS_COMPILE=${GCC_DIR}/bin/aarch64-linux-android-
        export CROSS_COMPILE_ARM32=${GCC_32_DIR}/bin/arm-linux-androideabi-
        export PATH="${CLANG_DIR}/bin:${GCC_DIR}/bin:${GCC_32_DIR}/bin:${PATH}"
        
        chmod +x build.sh
        ./build.sh -m g985f
        
    - name: Upload Kernel Image
      uses: actions/upload-artifact@v4
      with:
        name: kernel-image
        path: out_g985f/arch/arm64/boot/Image
