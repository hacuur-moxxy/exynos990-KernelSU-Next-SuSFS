name: Build Exynos 990 Kernel with Latest KSU Next

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout Kernel Source
      uses: actions/checkout@v4
      
    - name: Install Build Dependencies
      run: |
        sudo dpkg --add-architecture i386
        sudo apt-get update
        sudo apt-get install -y \
          build-essential \
          bc \
          bison \
          flex \
          libssl-dev \
          make \
          libc6-dev \
          libncurses5-dev \
          crossbuild-essential-arm64 \
          git \
          zip \
          curl \
          patch \
          libc6:i386 \
          lib32z1 \
          libncurses5:i386 || true
        
        echo "✓ Build dependencies installed"
        
    - name: Update KernelSU Next
      run: |
        rm -rf KernelSU-Next
        git clone https://github.com/KernelSU-Next/KernelSU-Next.git KernelSU-Next
        echo "✓ KernelSU-Next updated"
        
    - name: Download Toolchains
      run: |
        mkdir -p ../tc
        cd ../tc
        
        echo "Downloading GCC 4.9..."
        git clone --depth=1 https://android.googlesource.com/platform/prebuilts/gcc/linux-x86/aarch64/aarch64-linux-android-4.9 gcc49
        
        echo "Downloading AOSP Clang 10 (r370808)..."
        git clone --depth=1 https://android.googlesource.com/platform/prebuilts/clang/linux-x86/clang-r370808 clang10
        
        [ -f gcc49/bin/aarch64-linux-android-gcc ] || { echo "ERROR: GCC 4.9 not found"; exit 1; }
        [ -f clang10/bin/clang ] || { echo "ERROR: Clang 10 not found"; exit 1; }
        
        echo "✓ Toolchains downloaded and verified!"
        
    - name: Build the Kernel (g985f)
      run: |
        export CLANG_DIR=$(pwd)/../tc/clang10
        export GCC_DIR=$(pwd)/../tc/gcc49
        chmod +x build.sh
        echo "Building for SM-G985F (Galaxy S20+ 4G)..."
        ./build.sh -m g985f
        
    - name: Generate Build Info
      if: success()
      run: |
        IMG="out_g985f/arch/arm64/boot/Image"
        if [ -f "$IMG" ]; then
          SIZE=$(stat -c%s "$IMG")
          echo "✓ Build completed successfully!"
          echo "Kernel Image: $IMG"
          echo "Size: $SIZE bytes"
          echo "" > build_info.txt
          echo "=== Kernel Build Info ===" >> build_info.txt
          echo "Device: SM-G985F (Galaxy S20+ 4G)" >> build_info.txt
          echo "Image Size: $SIZE bytes" >> build_info.txt
          echo "MD5: $(md5sum $IMG | cut -d' ' -f1)" >> build_info.txt
          echo "SHA256: $(sha256sum $IMG | cut -d' ' -f1)" >> build_info.txt
          echo "Build Date: $(date)" >> build_info.txt
          cat build_info.txt
        fi
        
    - name: Upload Kernel Image
      if: success()
      uses: actions/upload-artifact@v4
      with:
        name: kernel-g985f-${{ github.run_number }}
        path: |
          out_g985f/arch/arm64/boot/Image
          build_info.txt
        retention-days: 30
        
    - name: Upload Build Logs on Failure
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: build-logs-g985f-${{ github.run_number }}
        path: out_g985f/
        retention-days: 7
